services:
  google-ads-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: google-ads-manager-ai-plugin:local
    container_name: google-ads-manager-ai-plugin
    ports:
      - "${MCP_PORT:-8000}:8000"
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8000"
      # Required because the container listens on 0.0.0.0. Use a long random value.
      MCP_HTTP_BEARER_TOKEN: "${MCP_HTTP_BEARER_TOKEN:?Set MCP_HTTP_BEARER_TOKEN to a long random value}"
      MCP_ALLOWED_HOSTS: "${MCP_ALLOWED_HOSTS:-}"
      MCP_RATE_LIMIT_MAX: "${MCP_RATE_LIMIT_MAX:-120}"
      GOOGLE_ADS_MAX_DAILY_BUDGET: "${GOOGLE_ADS_MAX_DAILY_BUDGET:-}"
      GOOGLE_ADS_MAX_BUDGET_INCREASE_PCT: "${GOOGLE_ADS_MAX_BUDGET_INCREASE_PCT:-}"
      GOOGLE_ADS_MAX_CPC_BID: "${GOOGLE_ADS_MAX_CPC_BID:-}"
      GOOGLE_ADS_DEVELOPER_TOKEN: "${GOOGLE_ADS_DEVELOPER_TOKEN}"
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: "${GOOGLE_ADS_LOGIN_CUSTOMER_ID:-}"
      GOOGLE_ADS_CUSTOMER_ID: "${GOOGLE_ADS_CUSTOMER_ID:-}"
      GOOGLE_ADS_IMPERSONATED_EMAIL: "${GOOGLE_ADS_IMPERSONATED_EMAIL:-}"
      # Mount the key into the container and point at the mount path.
      GOOGLE_ADS_SERVICE_ACCOUNT_PATH: /credentials/service-account.json
    volumes:
      # Bind-mount your local service account JSON (read-only). Do not bake secrets into the image.
      - "${GOOGLE_ADS_SERVICE_ACCOUNT_HOST_PATH:?Set GOOGLE_ADS_SERVICE_ACCOUNT_HOST_PATH to your local JSON key}:/credentials/service-account.json:ro"
    restart: unless-stopped
